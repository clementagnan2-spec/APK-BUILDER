name: Build APK Builder (.exe)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: pip install pyinstaller

      - name: Compiler le .exe
        run: pyinstaller --onefile --windowed --name APKBuilder apk_builder.py

      - uses: actions/upload-artifact@v4
        with:
          name: APKBuilder-exe
          path: dist/APKBuilder.exe

      - name: Publier une release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APKBuilder.exe
